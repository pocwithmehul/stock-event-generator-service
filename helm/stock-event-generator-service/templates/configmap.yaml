apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stock-event-generator-service.fullname" . }}
  labels:
    {{- include "stock-event-generator-service.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ .Values.config.serverPort }}
      webhookUrl: {{ .Values.config.webhookUrl | quote }}
    tickers:
{{- range .Values.config.tickers }}
      - {{ . | quote }}
{{- end }}
    intervalMs: {{ .Values.config.intervalMs }}
    datadog:
      apiKey: ""
      site: {{ .Values.datadog.site | quote }}
      env: {{ .Values.datadog.env | quote }}
